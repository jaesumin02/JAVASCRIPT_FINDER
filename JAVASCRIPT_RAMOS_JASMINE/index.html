<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Info Finder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');

        :root {
            color-scheme: light;
            --ink: #18332e;
            --muted: #667a72;
            --line: #d8e3dc;
            --accent: #e75d42;
            --accent-dark: #c84632;
            --forest: #175b50;
            --paper: #fbfaf4;
            --mint: #eff5ef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f0e6;
            background-image:
                linear-gradient(rgba(23, 91, 80, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(23, 91, 80, 0.035) 1px, transparent 1px),
                radial-gradient(#d9c7a8 1px, transparent 1px);
            background-size: 44px 44px, 44px 44px, 22px 22px;
        }

        .card {
            width: min(100%, 560px);
            padding: clamp(22px, 5vw, 36px);
            overflow: hidden;
            background: var(--paper);
            border: 1px solid rgba(24, 51, 46, 0.1);
            border-radius: 8px;
            box-shadow: 0 24px 60px rgba(37, 54, 43, 0.13);
            text-align: center;
            animation: arrive 420ms ease-out both;
        }

        .card h1 {
            color: var(--forest);
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(25px, 6vw, 34px);
            font-weight: 700;
            line-height: 1.1;
        }

        .subtitle {
            margin-top: 7px;
            margin-bottom: 22px;
            color: var(--muted);
            font-size: 14px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            color: var(--ink);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        .search-box input::placeholder {
            color: #91a198;
        }

        .search-box input:focus {
            border-color: var(--forest);
            box-shadow: 0 0 0 3px rgba(23, 91, 80, 0.12);
        }

        .search-box button {
            min-width: 104px;
            padding: 11px 18px;
            color: #fff;
            background: var(--forest);
            border: 0;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 160ms ease, transform 160ms ease;
        }

        .search-box button:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .search-box button:focus-visible {
            outline: 3px solid rgba(231, 93, 66, 0.35);
            outline-offset: 3px;
        }

        .search-box button:disabled {
            cursor: wait;
            opacity: 0.7;
            transform: none;
        }

        .result-container {
            display: grid;
            grid-template-columns: minmax(112px, 0.8fr) minmax(0, 1.2fr);
            grid-template-areas:
                'flag name'
                'flag capital'
                'flag region'
                'flag population';
            align-items: center;
            gap: 7px 20px;
            padding: 18px;
            margin-bottom: 12px;
            background: var(--mint);
            border: 1px solid #dce8dd;
            border-radius: 6px;
            text-align: left;
        }

        #countryFlag {
            grid-area: flag;
            width: 100%;
            aspect-ratio: 3 / 2;
            object-fit: contain;
            background: #fff;
            border: 1px solid rgba(24, 51, 46, 0.13);
            border-radius: 4px;
            box-shadow: 0 5px 12px rgba(24, 51, 46, 0.12);
        }

        .result-container h2 {
            grid-area: name;
            color: var(--ink);
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(19px, 4vw, 24px);
            line-height: 1.15;
            overflow-wrap: anywhere;
        }

        #capital { grid-area: capital; }
        #region { grid-area: region; }
        #population { grid-area: population; }

        .result-container p {
            color: #465d55;
            font-size: 13px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .status {
            min-height: 18px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        .status.success { color: #18724d; }
        .status.loading { color: #a35b17; }
        .status.error { color: #b53d32; }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 460px) {
            body {
                padding: 14px;
                align-items: flex-start;
            }

            .card {
                padding: 27px 18px 20px;
            }

            .search-box {
                gap: 8px;
            }

            .search-box button {
                min-width: 88px;
                padding-inline: 12px;
            }

            .result-container {
                grid-template-columns: minmax(88px, 0.72fr) minmax(0, 1.28fr);
                gap: 6px 13px;
                padding: 13px;
            }
        }

        @media (max-height: 520px) {
            body {
                align-items: flex-start;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Country Info Finder</h1>
        <p class="subtitle">Search any country in the world</p>

        <div class="search-box">
            <input type="text" id="countryInput" placeholder="e.g., Philippines, Japan" value="Philippines">
            <button id="searchBtn" type="button">Search</button>
        </div>

        <div class="result-container">
            <img id="countryFlag" src="" alt="Country flag" hidden>
            <h2 id="countryName">--</h2>
            <p id="capital">Capital: --</p>
            <p id="region">Region: --</p>
            <p id="population">Population: --</p>
        </div>

        <p id="statusText" class="status">Ready</p>
    </div>

    <script>
        const countryInput = document.getElementById("countryInput");
        const searchBtn = document.getElementById("searchBtn");
        const countryFlag = document.getElementById("countryFlag");
        const countryName = document.getElementById("countryName");
        const capital = document.getElementById("capital");
        const region = document.getElementById("region");
        const population = document.getElementById("population");
        const statusText = document.getElementById("statusText");

        async function searchCountry(countryQuery) {
            const query = countryQuery.trim();
            if (!query) {
                resetResult();
                statusText.textContent = "Type a country name first.";
                statusText.className = "status error";
                countryInput.focus();
                return;
            }

            statusText.textContent = "Searching country...";
            statusText.className = "status loading";
            searchBtn.disabled = true;
            searchBtn.textContent = "Searching...";

            try {
                const response = await fetch("https://api.worldbank.org/v2/country?format=json&per_page=300");
                if (!response.ok) throw new Error("Country service unavailable");

                const data = await response.json();
                const countries = data[1] || [];
                const normalizedQuery = query.toLowerCase();
                const country = countries.find((item) => item.name.toLowerCase() === normalizedQuery)
                    || countries.find((item) => item.name.toLowerCase().includes(normalizedQuery));

                if (!country) throw new Error("Country not found");

                const populationResponse = await fetch(
                    `https://api.worldbank.org/v2/country/${country.id}/indicator/SP.POP.TOTL?format=json&date=2024`
                );
                const populationData = populationResponse.ok ? await populationResponse.json() : null;
                const populationValue = populationData?.[1]?.[0]?.value;

                countryFlag.src = `https://flagcdn.com/w320/${country.iso2Code.toLowerCase()}.png`;
                countryFlag.hidden = false;
                countryFlag.alt = `${country.name} flag`;
                countryName.textContent = country.name;
                capital.textContent = `Capital: ${country.capitalCity || "N/A"}`;
                region.textContent = `Region: ${country.region?.value?.trim() || "N/A"}`;
                population.textContent = `Population: ${typeof populationValue === "number" ? populationValue.toLocaleString() : "N/A"}`;

                statusText.textContent = "Country found successfully!";
                statusText.className = "status success";
            } catch (error) {
                console.error("Error:", error);
                resetResult();
                statusText.textContent = "Country not found. Please check spelling.";
                statusText.className = "status error";
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = "Search";
            }
        }

        function resetResult() {
            countryFlag.hidden = true;
            countryFlag.removeAttribute("src");
            countryName.textContent = "Search for a country";
            capital.textContent = "Capital: --";
            region.textContent = "Region: --";
            population.textContent = "Population: --";
        }

        searchCountry("Philippines");

        searchBtn.addEventListener("click", () => {
            searchCountry(countryInput.value);
        });

        countryInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                searchCountry(countryInput.value);
            }
        });
    </script>
</body>
</html>
